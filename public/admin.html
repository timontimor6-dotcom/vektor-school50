<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ВЕКТОР — управление новостями</title>
<style>
:root{color-scheme:dark;--bg:#090b11;--panel:#11151f;--line:#ffffff18;--text:#f4f5f8;--muted:#9da4b3;--yellow:#ffd21a;--red:#ff6c70;--green:#65d6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#202536 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.55 Inter,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-weight:950;letter-spacing:2px;font-size:24px}.brand span{color:var(--yellow)}.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 55px #0004}.login{max-width:430px;margin:8vh auto}.field{width:100%;background:#080b12;border:1px solid var(--line);border-radius:10px;color:white;padding:13px 14px;font:inherit;outline:none}.field:focus{border-color:var(--yellow)}
button,select{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--yellow);color:#171717}button.secondary{background:#ffffff12;color:white;border:1px solid var(--line)}button.danger{background:#ff6c701b;color:#ff9295;border:1px solid #ff6c7044}button:disabled{opacity:.5;cursor:wait}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.toolbar select{background:#101520;color:white;border:1px solid var(--line);padding:10px;border-radius:9px}.stats{color:var(--muted);font-size:13px;margin-left:auto}.post{padding:18px 0;border-top:1px solid var(--line)}.post:first-child{border-top:0}.posthead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.post h3{margin:5px 0 9px;font-size:19px;line-height:1.3}.tag{font-size:11px;color:var(--yellow);font-weight:900;text-transform:uppercase;letter-spacing:.7px}.post p{color:#c2c7d1;margin:6px 0;white-space:pre-wrap}.meta{font-size:12px;color:var(--muted);margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}.note{font-size:13px;color:var(--muted);margin-top:14px}.err{color:#ff9295;margin-top:10px}.ok{color:var(--green)}a{color:var(--yellow)}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.panel{padding:16px}.posthead{display:block}.stats{margin-left:0}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">ВЕКТОР<span>.</span> / NEWS CONTROL</div><a href="/" class="muted">← На сайт</a></header>
<section id="login" class="panel login"><h1>Вход в модерацию</h1><p class="muted">Панель доступна только по паролю администратора.</p><form id="loginForm"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Пароль администратора" required><div style="height:12px"></div><button type="submit" style="width:100%">Войти</button><div id="loginError" class="err"></div></form></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="top" style="margin:0"><div><h1 style="margin:0">Модерация новостей</h1><div class="muted">Публикации не появятся на сайте, пока ты их не одобришь.</div></div><button id="logout" class="secondary">Выйти</button></div>
<div class="toolbar"><select id="status"><option value="pending">На проверке</option><option value="approved">Одобренные</option><option value="rejected">Отклонённые</option></select><button id="refresh" class="secondary">Обновить</button><button id="webhook" class="secondary">Подключить Telegram-бота</button><span id="count" class="stats"></span></div><div id="message" class="note"></div><div id="posts"><div class="empty">Загрузка…</div></div>
</div></section>
</main>
<script>
const api='/api/admin';let token='';const $=id=>document.getElementById(id);
async function request(payload){const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:`Bearer ${token}`}:{})},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({error:'Ошибка ответа сервера'}));if(!r.ok)throw new Error([data.error,data.detail].filter(Boolean).join(' — ')||'Ошибка запроса');return data}
function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadPosts(); }
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='Проверяем пароль…';try{const r=await request({action:'login',password:$('password').value});token=r.token;$('password').value='';$('loginError').textContent='';showDashboard()}catch(err){$('loginError').textContent=err.message}});
$('logout').onclick=()=>{token='';$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
$('refresh').onclick=loadPosts;$('status').onchange=loadPosts;
$('webhook').onclick=async()=>{try{const r=await request({action:'setupTelegramWebhook'});$('message').textContent=r.description||'Telegram webhook подключён';$('message').className='note ok'}catch(e){$('message').textContent=e.message;$('message').className='note err'}};
function safeLink(url){try{const u=new URL(url);return ['https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(posts){const root=$('posts');root.replaceChildren();$('count').textContent=`Публикаций: ${posts.length}`;if(!posts.length){root.innerHTML='<div class="empty">В этой категории пока нет публикаций.</div>';return}
for(const p of posts){const card=document.createElement('article');card.className='post';const tag=document.createElement('div');tag.className='tag';tag.textContent=`${p.category} · ${p.source}`;const h=document.createElement('h3');h.textContent=p.title||'Без заголовка';const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(p.published_at||p.created_at).toLocaleString('ru-RU');const summary=document.createElement('p');summary.textContent=p.content||p.summary||'';card.append(tag,h,meta,summary);const link=safeLink(p.url);if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть источник ↗';card.append(a)}
const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Редактировать';edit.onclick=()=>editPost(p);actions.append(edit);if(p.status==='pending'){const yes=document.createElement('button');yes.textContent='Одобрить';yes.onclick=()=>act('approve',p.id);const no=document.createElement('button');no.className='danger';no.textContent='Отклонить';no.onclick=()=>act('reject',p.id);actions.append(yes,no)}else{const del=document.createElement('button');del.className='danger';del.textContent='Удалить';del.onclick=()=>act('delete',p.id);actions.append(del)}card.append(actions);root.append(card)} }
async function loadPosts(){ $('posts').innerHTML='<div class="empty">Загрузка…</div>';try{const r=await request({action:'list',status:$('status').value});render(r.posts||[]);$('message').textContent='';}catch(e){$('posts').innerHTML=`<div class="empty">${e.message}</div>`}}
async function editPost(p){const title=prompt('Заголовок новости:',p.title||'');if(title===null)return;const content=prompt('Текст новости:',p.content||p.summary||'');if(content===null)return;try{await request({action:'edit',id:p.id,title:title.trim(),summary:content.trim().slice(0,320),content:content.trim()});$('message').textContent='Изменения сохранены.';$('message').className='note ok';await loadPosts()}catch(e){$('message').textContent=e.message;$('message').className='note err'}}
async function act(action,id){try{await request({action,id});$('message').textContent=action==='approve'?'Новость одобрена и опубликована.':'Готово.';$('message').className='note ok';await loadPosts()}catch(e){$('message').textContent=e.message;$('message').className='note err'}}
</script></body></html>
