[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news-public"
  status = 200

[[redirects]]
  from = "/api/news-admin"
  to = "/.netlify/functions/news-admin"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200
